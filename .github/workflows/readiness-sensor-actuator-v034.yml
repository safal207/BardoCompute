name: Readiness Sensor-Actuator Compatibility v0.34

on:
  push:
    branches:
      - research/v0.34-readiness-actuator-compatibility
    paths:
      - benchmarks/readiness_sensor_actuator_compatibility_v034.py
      - .github/workflows/readiness-sensor-actuator-v034.yml
      - docs/v0.34-readiness-sensor-actuator-run-note.txt
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run Readiness Sensor-Actuator Compatibility v0.34
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmarks/readiness_sensor_actuator_compatibility_v034.py | tee /tmp/v034.log
          awk '/^\[sensor_actuator_compatibility\]$/{show=1} show{print}' /tmp/v034.log > /tmp/attribution.txt
          {
            echo "Hosted v0.34 — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/attribution.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 26 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
