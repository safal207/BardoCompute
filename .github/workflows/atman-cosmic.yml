name: ATMAN Cosmic Observer Benchmark

on:
  push:
  pull_request:

jobs:
  native-benchmark-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/atman_cosmic_observer_bench.c -o native/atman_cosmic_observer_bench
      - run: ./native/atman_cosmic_observer_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/cosmic_hybrid_sweep.c -o native/cosmic_hybrid_sweep
      - run: ./native/cosmic_hybrid_sweep
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/morphology_register_bench.c -o native/morphology_register_bench
      - run: ./native/morphology_register_bench

  native-benchmark-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/atman_cosmic_observer_bench.c -o native/atman_cosmic_observer_bench
      - run: ./native/atman_cosmic_observer_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/cosmic_hybrid_sweep.c -o native/cosmic_hybrid_sweep
      - run: ./native/cosmic_hybrid_sweep
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/morphology_register_bench.c -o native/morphology_register_bench
      - run: ./native/morphology_register_bench