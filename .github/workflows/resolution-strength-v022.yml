name: Resolution Strength v0.22

on:
  push:
    branches:
      - research/v0.22-resolution-strength
    paths:
      - benchmarks/resolution_strength_v022.py
      - docs/v0.22-trigger.txt
      - .github/workflows/resolution-strength-v022.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run Resolution Strength v0.22
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python benchmarks/resolution_strength_v022.py | tee /tmp/resolution-strength-v022.log
          code=${PIPESTATUS[0]}

          awk '/^\[overall\]$/{show=1} show{print}' /tmp/resolution-strength-v022.log > /tmp/overall.txt
          {
            echo "Hosted v0.22 — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/overall.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if grep -q '^passes_preregistered_acceptance=false$' /tmp/resolution-strength-v022.log; then
            echo 'v0.22 hypothesis rejected by preregistered criteria; retaining as valid evidence.'
            exit 0
          fi
          exit "$code"
