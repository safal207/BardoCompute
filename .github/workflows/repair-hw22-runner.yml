name: Repair BARDO HW-22 one-shot runner

on:
  push:
    branches:
      - hardware/v0.1-bardo-tx1
    paths:
      - .github/workflows/repair-hw22-runner.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardware/v0.1-bardo-tx1
          fetch-depth: 0
      - name: Remove invalid YAML condition and self-clean
        run: |
          sed -i "/head_commit.message/d" .github/workflows/apply-hw22-claim-fix.yml
          rm .github/workflows/repair-hw22-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: repair HW-22 one-shot runner"
          git push origin HEAD:hardware/v0.1-bardo-tx1
