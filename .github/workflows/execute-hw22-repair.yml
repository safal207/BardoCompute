name: Execute BARDO HW-22 repair payload

on:
  push:
    branches:
      - hardware/v0.1-bardo-tx1
    paths:
      - .github/workflows/execute-hw22-repair.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardware/v0.1-bardo-tx1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract and execute reviewed repair payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-hw22-claim-fix.yml').read_text(
              encoding='utf-8'
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Run focused fail-closed regressions"
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len("          PY\n")
          payload_lines = []
          for raw_line in source[start:end].splitlines():
              if 'workflow = Path(".github/workflows/apply-hw22-claim-fix.yml")' in raw_line:
                  continue
              if 'workflow.unlink()' in raw_line:
                  continue
              if not raw_line.startswith('          '):
                  raise SystemExit(f'unexpected payload indentation: {raw_line!r}')
              payload_lines.append(raw_line[10:])
          Path('/tmp/apply-hw22.sh').write_text(
              '\n'.join(payload_lines) + '\n',
              encoding='utf-8',
          )
          PY
          bash /tmp/apply-hw22.sh
      - name: Run focused fail-closed regressions
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_hardware_claims.py tests/test_fpga_harness.py
          git diff --check
      - name: Commit only product and regression changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/bardocompute/hardware_claims.py \
            fpga/ulx3s-85f/Makefile \
            tests/test_hardware_claims.py
          git diff --cached --quiet && { echo 'No repair changes produced'; exit 1; }
          git commit -m "hardware: bind FPGA profile and self-test evidence"
          git push origin HEAD:hardware/v0.1-bardo-tx1
