name: Apply BARDO HW-22 claim binding repair

on:
  push:
    branches:
      - hardware/v0.1-bardo-tx1
    paths:
      - .github/workflows/apply-hw22-claim-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply HW-22 claim binding repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardware/v0.1-bardo-tx1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact profile and self-test binding repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          claims = "src/bardocompute/hardware_claims.py"

          replace_once(
              claims,
              'EQUAL_THROUGHPUT_REL_TOLERANCE = 0.05\n\n_KEY_RE',
              '''EQUAL_THROUGHPUT_REL_TOLERANCE = 0.05
EXPECTED_SELF_TEST_SIGNATURE = "0xf8cc45c1e3244a5a"
