def test_cli_rejects_internally_checksummed_mixed_fpga_profile(
    tmp_path: Path,
) -> None:
    fpga_path = tmp_path / "evidence.txt"
    cpu_path = tmp_path / "cpu.log"
    report_path = tmp_path / "nextpnr-report.json"
    sums_path = tmp_path / "SHA256SUMS"
    json_output = tmp_path / "claim.json"
    markdown_output = tmp_path / "claim.md"

    fpga = fpga_evidence_75()
    fpga_path.write_text(
        "\\n".join(f"{key}={value}" for key, value in fpga.items()) + "\\n",
        encoding="utf-8",
    )
    cpu_path.write_text(
        "\\n".join(f"{key}={value}" for key, value in cpu_evidence().items()) + "\\n",
        encoding="utf-8",
    )
    report = nextpnr_report()
    report["fmax"] = {
        "$glbnet$clk_75mhz": {
            "achieved": 90.456802,
            "constraint": 75.00187683105469,
        }
    }
    report_path.write_text(json.dumps(report), encoding="utf-8")

    # Every recorded hash is internally correct, but the only bitstream is the
    # native profile. The 75 MHz profile must select its own exact filename.
    sums_path.write_text(
        f"{BITSTREAM_SHA256}  build/bardo_tx1_ulx3s_bench.bit\\n"
        f"{_digest(fpga_path)}  build-75mhz/evidence.txt\\n"
        f"{_digest(report_path)}  build-75mhz/nextpnr-report.json\\n",
        encoding="utf-8",
    )

    result = main(
        [
            "--fpga-evidence",
            str(fpga_path),
            "--cpu-evidence",
            str(cpu_path),
            "--nextpnr-report",
            str(report_path),
            "--sha256s",
            str(sums_path),
            "--json-output",
            str(json_output),
            "--markdown-output",
            str(markdown_output),
        ]
    )

    assert result == 1
    assert not json_output.exists()
'''
