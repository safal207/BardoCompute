name: Queue and Batch Cost Mediation v0.39

on:
  push:
    branches:
      - research/v0.39-cost-mediation
    paths:
      - benchmarks/cost_mediation_v039.py
      - .github/workflows/cost-mediation-v039.yml
      - docs/v0.39-cost-mediation-run-note.txt
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run Queue and Batch Cost Mediation v0.39
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmarks/cost_mediation_v039.py | tee /tmp/v039.log
          awk '/^\[cost_mediation\]$/{show=1} show{print}' /tmp/v039.log > /tmp/diagnostic.txt
          {
            echo "Hosted v0.39 — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/diagnostic.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 32 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
