name: Recovery State Transfer Benchmark

on:
  push:
    branches:
      - research/v0.1-executable-algebra
  pull_request:

jobs:
  transfer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_probe_cadence.py tests/test_headroom_gate.py tests/test_policy_orientation.py
      - run: python benchmarks/recovery_state_transfer.py
      - run: python benchmarks/risk_constrained_recovery.py