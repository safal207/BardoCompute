name: Action Boundary Fencing Benchmark

on:
  push:
    branches:
      - research/v0.1-executable-algebra
  pull_request:

jobs:
  fencing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python benchmarks/action_boundary_fencing.py
