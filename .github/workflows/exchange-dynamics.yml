name: Computational Membrane Exchange Benchmark

on:
  push:
    branches:
      - research/v0.1-executable-algebra
  pull_request:

jobs:
  exchange:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pytest -q tests/test_exchange.py
      - name: Run falsification benchmark
        shell: bash
        run: |
          set +e
          python benchmarks/exchange_dynamics.py | tee /tmp/exchange-dynamics.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if grep -q '^passes_preregistered_acceptance=false$' /tmp/exchange-dynamics.log; then
            echo 'Hypothesis rejected by preregistered criteria; retaining as valid evidence.'
            exit 0
          fi
          exit "$code"
