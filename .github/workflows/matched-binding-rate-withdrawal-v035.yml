name: Matched Binding RATE-Withdrawal v0.35

on:
  push:
    branches:
      - research/v0.35-matched-binding-withdrawal
    paths:
      - benchmarks/matched_binding_rate_withdrawal_v035.py
      - .github/workflows/matched-binding-rate-withdrawal-v035.yml
      - docs/v0.35-matched-binding-run-note.txt
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run Matched Binding RATE-Withdrawal v0.35
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmarks/matched_binding_rate_withdrawal_v035.py | tee /tmp/v035.log
          awk '/^\[matched_binding_effects\]$/{show=1} show{print}' /tmp/v035.log > /tmp/diagnostic.txt
          {
            echo "Hosted v0.35 — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/diagnostic.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 27 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
