name: Real Work Queue Outcome Audit R3

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run outcome-separated real work-queue audit
        run: python benchmarks/real_work_queue_outcome_audit_r3.py
