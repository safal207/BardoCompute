name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python benchmarks/bardo_vs_binary.py
      - run: python benchmarks/continuity_vs_metadata.py
      - run: python benchmarks/recovery_guard.py
      - run: python benchmarks/equal_information_control.py
      - run: python benchmarks/tao_defer.py
      - run: python benchmarks/tao_equal_information_control.py
      - run: python benchmarks/tao_orientation_routing.py
      - run: python benchmarks/trajectory_guard.py
      - run: python benchmarks/trajectory_kinetics.py
      - run: python benchmarks/phase_edge_trajectory.py
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/bardo_bench.c -o native/bardo_bench
      - run: ./native/bardo_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/bardo_tao_bench.c -o native/bardo_tao_bench
      - run: ./native/bardo_tao_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/temporal_signature_bench.c -o native/temporal_signature_bench
      - run: ./native/temporal_signature_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/kinetic_signature_bench.c -o native/kinetic_signature_bench
      - run: ./native/kinetic_signature_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/trigram_bench.c -o native/trigram_bench
      - run: ./native/trigram_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic -fopt-info-vec-optimized native/group_control.c -o native/group_control
      - run: ./native/group_control
      - run: cc -O3 -fno-tree-vectorize -std=c11 -Wall -Wextra -pedantic native/group_control.c -o native/group_control_scalar
      - run: ./native/group_control_scalar
      - run: cc -O3 -DBARDO_TUNE_DENSE -std=c11 -Wall -Wextra -pedantic native/group_control.c -o native/group_control_tuned
      - run: ./native/group_control_tuned
