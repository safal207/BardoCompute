name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q
      - run: python benchmarks/bardo_vs_binary.py
      - run: python benchmarks/continuity_vs_metadata.py
      - run: python benchmarks/recovery_guard.py
      - run: python benchmarks/equal_information_control.py
      - run: python benchmarks/tao_defer.py
      - run: python benchmarks/tao_equal_information_control.py
      - run: python benchmarks/tao_orientation_routing.py
      - run: python benchmarks/trajectory_guard.py
      - run: python benchmarks/trajectory_kinetics.py
      - run: python benchmarks/phase_edge_trajectory.py
      - run: python benchmarks/phase_age.py
      - run: python benchmarks/temporal_state16.py
      - run: python benchmarks/capability_flow.py
      - run: python benchmarks/capability_recovery.py
      - run: python benchmarks/stochastic_adaptability.py
      - run: python benchmarks/orientation_payback.py
      - run: python benchmarks/observer_zoom.py
      - run: python benchmarks/observation_payback.py
      - run: python benchmarks/calibration_aware_payback.py
      - run: python benchmarks/adaptive_probe_cadence.py
      - run: python benchmarks/hazard_aware_cadence.py
      - run: python benchmarks/hazard_cadence_robustness.py
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/bardo_bench.c -o native/bardo_bench
      - run: ./native/bardo_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/bardo_tao_bench.c -o native/bardo_tao_bench
      - run: ./native/bardo_tao_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/temporal_signature_bench.c -o native/temporal_signature_bench
      - run: ./native/temporal_signature_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/kinetic_signature_bench.c -o native/kinetic_signature_bench
      - run: ./native/kinetic_signature_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/phase_edge_bench.c -o native/phase_edge_bench
      - run: ./native/phase_edge_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/phase_age_bench.c -o native/phase_age_bench
      - run: ./native/phase_age_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/temporal_state16_bench.c -o native/temporal_state16_bench
      - run: ./native/temporal_state16_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/capability_state16_bench.c -o native/capability_state16_bench
      - run: ./native/capability_state16_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/capability_recovery_bench.c -o native/capability_recovery_bench
      - run: ./native/capability_recovery_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/capability_entropy_bench.c -o native/capability_entropy_bench
      - run: ./native/capability_entropy_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/adaptive_execution_bench.c -o native/adaptive_execution_bench
      - run: ./native/adaptive_execution_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/atman_observer_bench.c -o native/atman_observer_bench
      - run: ./native/atman_observer_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/policy_lut_sweep.c -o native/policy_lut_sweep
      - run: ./native/policy_lut_sweep
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic native/trigram_bench.c -o native/trigram_bench
      - run: ./native/trigram_bench
      - run: cc -O3 -std=c11 -Wall -Wextra -pedantic -fopt-info-vec-optimized native/group_control.c -o native/group_control
      - run: ./native/group_control
      - run: cc -O3 -fno-tree-vectorize -std=c11 -Wall -Wextra -pedantic native/group_control.c -o native/group_control_scalar
      - run: ./native/group_control_scalar
      - run: cc -O3 -DBARDO_TUNE_DENSE -std=c11 -Wall -Wextra -pedantic native/group_control.c -o native/group_control_tuned
      - run: ./native/group_control_tuned