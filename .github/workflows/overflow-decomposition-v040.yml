name: Counterfactual Overflow Decomposition v0.40

on:
  push:
    branches:
      - research/v0.40-overflow-decomposition
    paths:
      - benchmarks/overflow_decomposition_v040.py
      - .github/workflows/overflow-decomposition-v040.yml
      - docs/v0.40-overflow-decomposition-run-note.txt
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run Counterfactual Overflow Decomposition v0.40
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmarks/overflow_decomposition_v040.py | tee /tmp/v040.log
          awk '/^\[overflow_decomposition\]$/{show=1} show{print}' /tmp/v040.log > /tmp/diagnostic.txt
          {
            echo "Hosted v0.40 — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/diagnostic.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 34 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
