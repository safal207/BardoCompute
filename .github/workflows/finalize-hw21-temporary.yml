name: Finalize BARDO HW-21 temporary

on:
  push:
    branches:
      - hardware/v0.1-bardo-tx1
    paths:
      - ".github/workflows/finalize-hw21-temporary.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  close-review-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardware/v0.1-bardo-tx1
          fetch-depth: 0
      - name: Require the verified repair and a clean one-shot state
        run: |
          set -euo pipefail
          test -f native/bardo_tx1_expected_table.h
          test -f tests/test_cpu_oracle.py
          test ! -e .github/scripts/apply_hw21.py
          test ! -e .github/workflows/apply-hw21-temporary.yml
          test ! -e .github/workflows/export-source-temporary.yml
          test ! -e .github/workflows/verify-hw21-temporary.yml
          grep -Fq 'assign in_ready = rst_n &&' rtl/bardo_tx1.sv
          grep -Fq 'requires_both_gates' src/bardocompute/hardware_claims.py
          grep -Fq 'throughput_comparable' src/bardocompute/hardware_claims.py
          grep -Fq 'lane_position_mix' fpga/ulx3s-85f/bardo_tx1_ulx3s_bench.sv
      - name: Publish a clean head without this finalizer
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-hw21-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: remove completed BARDO HW-21 closure gate"
          git push origin HEAD:hardware/v0.1-bardo-tx1
      - name: Request Codex review on the exact clean head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$HEAD_SHA" > /tmp/hw21-head
          gh pr comment 40 --repo "$GITHUB_REPOSITORY" --body "@codex review

Final HW-21 closure review requested for exact clean head \`$HEAD_SHA\`. Please check the seven original P1/P2 findings and report only remaining actionable issues."
      - name: Wait for Codex to review this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(cat /tmp/hw21-head)"
          FOUND=false
          for attempt in $(seq 1 120); do
            REVIEWS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/40/reviews")"
            if jq -e --arg head "$HEAD_SHA" '
              .[]
              | select(.commit_id == $head)
              | select(.user.login | startswith("chatgpt-codex-connector"))
            ' >/dev/null <<<"$REVIEWS"; then
              FOUND=true
              break
            fi
            sleep 10
          done
          test "$FOUND" = true
      - name: Count exact-head findings and resolve superseded Codex threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(cat /tmp/hw21-head)"
          COMMENTS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/40/comments")"
          jq --arg head "$HEAD_SHA" '[
            .[]
            | select(.commit_id == $head)
            | select(.user.login | startswith("chatgpt-codex-connector"))
          ]' <<<"$COMMENTS" > /tmp/hw21-findings.json
          FINDINGS="$(jq 'length' /tmp/hw21-findings.json)"
          printf '%s\n' "$FINDINGS" > /tmp/hw21-findings-count

          if [ "$FINDINGS" -ne 0 ]; then
            jq -r '.[] | "- " + .path + ": " + (.body | split("\n")[0])' \
              /tmp/hw21-findings.json > /tmp/hw21-finding-lines
            BODY="$(cat /tmp/hw21-finding-lines)"
            gh pr comment 40 --repo "$GITHUB_REPOSITORY" --body "<!-- bardo-hw21-final -->
## BARDO HW-21 closure: BLOCKED

- exact head: \`$HEAD_SHA\`
- Codex exact-head findings: \`$FINDINGS\`

$BODY"
            exit 1
          fi

          OWNER="$GITHUB_REPOSITORY_OWNER"
          REPO="${GITHUB_REPOSITORY#*/}"
          THREADS="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{id isResolved comments(first:20){nodes{author{login}}}}}}}}' \
            -f owner="$OWNER" \
            -f repo="$REPO" \
            -F number=40)"
          jq -r '.data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved == false)
            | select(any(.comments.nodes[]; .author.login | startswith("chatgpt-codex-connector")))
            | .id' <<<"$THREADS" > /tmp/hw21-thread-ids

          RESOLVED=0
          while IFS= read -r THREAD_ID; do
            [ -n "$THREAD_ID" ] || continue
            gh api graphql \
              -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{id isResolved}}}' \
              -f id="$THREAD_ID" >/dev/null
            RESOLVED=$((RESOLVED + 1))
          done < /tmp/hw21-thread-ids
          printf '%s\n' "$RESOLVED" > /tmp/hw21-resolved-count
      - name: Publish the machine-readable PASS boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(cat /tmp/hw21-head)"
          FINDINGS="$(cat /tmp/hw21-findings-count)"
          RESOLVED="$(cat /tmp/hw21-resolved-count)"
          gh pr comment 40 --repo "$GITHUB_REPOSITORY" --body "<!-- bardo-hw21-final -->
## BARDO HW-21 closure: PASS

- exact clean head: \`$HEAD_SHA\`
- Codex review on this SHA: completed
- new actionable findings: \`$FINDINGS\`
- superseded Codex threads resolved: \`$RESOLVED\`
- merge performed: \`false\`

The seven original evidence, reset, oracle, lane-identity, and workflow-trigger boundaries are closed on this exact commit. Physical host-fed CPU competition remains unproven and claim-gated."
