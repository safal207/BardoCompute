name: Support Factorial v0.25

on:
  push:
    branches:
      - research/v0.25-support-factorial
    paths:
      - benchmarks/support_factorial_v025.py
      - .github/workflows/support-factorial-v025.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run Support Factorial v0.25
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmarks/support_factorial_v025.py | tee /tmp/support-factorial-v025.log
          awk '/^\[causal_factorial\]$/{show=1} show{print}' /tmp/support-factorial-v025.log > /tmp/causal.txt
          {
            echo "Hosted v0.25 — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/causal.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 9 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
