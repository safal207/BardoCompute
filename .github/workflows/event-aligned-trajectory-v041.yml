name: Event-Aligned Support Trajectory v0.41

on:
  push:
    branches:
      - research/v0.41-event-aligned-trajectory
    paths:
      - benchmarks/event_aligned_trajectory_v041.py
      - .github/workflows/event-aligned-trajectory-v041.yml
      - docs/v0.41-event-aligned-run-note.txt
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run Event-Aligned Support Trajectory v0.41
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmarks/event_aligned_trajectory_v041.py | tee /tmp/v041.log
          awk '/^\[event_aligned_trajectory\]$/{show=1} show{print}' /tmp/v041.log > /tmp/diagnostic.txt
          {
            echo "Hosted v0.41 — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/diagnostic.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 36 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
