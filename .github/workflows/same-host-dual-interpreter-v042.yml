name: Same-Host Dual-Interpreter Evidence Boundary v0.42

on:
  push:
    branches:
      - research/v0.42-same-host-dual-interpreter
    paths:
      - benchmarks/same_host_dual_interpreter_v042.py
      - .github/workflows/same-host-dual-interpreter-v042.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Python 3.11 environment
        shell: bash
        run: |
          python -m venv .venv311
          .venv311/bin/python -m pip install --upgrade pip
          .venv311/bin/python -m pip install -e . pytest

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Python 3.12 environment
        shell: bash
        run: |
          python -m venv .venv312
          .venv312/bin/python -m pip install --upgrade pip
          .venv312/bin/python -m pip install -e . pytest

      - name: Verify focused tests under both interpreters
        shell: bash
        run: |
          .venv311/bin/python -m pytest -q tests/test_exchange.py
          .venv312/bin/python -m pytest -q tests/test_exchange.py

      - name: Run same-host dual-interpreter audit v0.42
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .venv312/bin/python benchmarks/same_host_dual_interpreter_v042.py \
            --coordinator \
            --py311 .venv311/bin/python \
            --py312 .venv312/bin/python \
            --json-output /tmp/v042-results.json \
            | tee /tmp/v042.log

          awk '/^\[same_host_dual_interpreter\]$/{show=1} show{print}' \
            /tmp/v042.log > /tmp/diagnostic.txt

          {
            echo "Hosted v0.42 — same VM, CPython 3.11 + 3.12"
            echo
            echo '```text'
            cat /tmp/diagnostic.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
            echo "workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/comment.md

          gh issue comment 38 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Upload full v0.42 traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: same-host-dual-interpreter-v042-${{ github.run_id }}
          path: |
            /tmp/v042.log
            /tmp/v042-results.json
          if-no-files-found: warn
          retention-days: 14
