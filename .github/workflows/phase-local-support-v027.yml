name: Phase-Local Support v0.27

on:
  push:
    branches:
      - research/v0.27-phase-local-support
    paths:
      - benchmarks/phase_local_support_v027.py
      - .github/workflows/phase-local-support-v027.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run Phase-Local Support v0.27
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmarks/phase_local_support_v027.py | tee /tmp/phase-local-v027.log
          awk '/^\[phase_local_causal\]$/{show=1} show{print}' /tmp/phase-local-v027.log > /tmp/causal.txt
          {
            echo "Hosted v0.27 — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/causal.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 13 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
