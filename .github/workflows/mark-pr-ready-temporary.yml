name: Mark BARDO-TX1 PR ready

on:
  push:
    branches:
      - hardware/v0.1-bardo-tx1

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark pull request ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr ready 40 --repo "$GITHUB_REPOSITORY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/40" --jq '.draft')" = "false"
