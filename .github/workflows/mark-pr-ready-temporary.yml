name: Mark BARDO-TX1 PR ready

on:
  push:
    branches:
      - hardware/v0.1-bardo-tx1

permissions:
  contents: write
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark pull request ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER="$GITHUB_REPOSITORY_OWNER"
          REPO="${GITHUB_REPOSITORY#*/}"
          PR_ID="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){id}}}' \
            -f owner="$OWNER" \
            -f repo="$REPO" \
            -F number=40 \
            --jq '.data.repository.pullRequest.id')"
          test -n "$PR_ID"
          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' \
            -f id="$PR_ID" \
            --jq '.data.markPullRequestReadyForReview.pullRequest'
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/40" --jq '.draft')" = "false"
