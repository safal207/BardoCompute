name: RATE-cap Binding Attribution v0.29b

on:
  push:
    branches:
      - research/v0.29-readiness-attribution
    paths:
      - benchmarks/rate_cap_binding_attribution_v029b.py
      - .github/workflows/rate-cap-binding-attribution-v029b.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run RATE-cap Binding Attribution v0.29b
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python benchmarks/rate_cap_binding_attribution_v029b.py | tee /tmp/v029b.log
          awk '/^\[binding_attribution\]$/{show=1} show{print}' /tmp/v029b.log > /tmp/attribution.txt
          {
            echo "Hosted v0.29b — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/attribution.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
