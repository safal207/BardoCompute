name: Failure Predicate Handoff v0.42

on:
  push:
    branches:
      - research/v0.42-failure-handoff
    paths:
      - benchmarks/failure_handoff_v042.py
      - .github/workflows/failure-handoff-v042.yml
      - docs/v0.42-failure-handoff-run-note.txt
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q tests/test_exchange.py
      - name: Run Failure Predicate Handoff v0.42
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python benchmarks/failure_handoff_v042.py | tee /tmp/v042.log
          awk '/^\[failure_handoff\]$/{show=1} show{print}' /tmp/v042.log > /tmp/diagnostic.txt
          {
            echo "Hosted v0.42 — Python ${{ matrix.python-version }}"
            echo
            echo '```text'
            cat /tmp/diagnostic.txt
            echo '```'
            echo
            echo "commit: $GITHUB_SHA"
          } > /tmp/comment.md
          gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
